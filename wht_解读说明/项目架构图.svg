<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5b6677; }
      .panel { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.2; rx: 14; }
      .appPanel { fill: #f2fbf5; }
      .apiPanel { fill: #edf6ff; }
      .corePanel { fill: #fffdf5; }
      .depPanel { fill: #f8f3ff; }
      .box { fill: #ffffff; stroke: #9aa7ba; stroke-width: 1.3; rx: 9; }
      .boxApp { fill: #ffffff; stroke: #70ad7d; }
      .boxApi { fill: #ffffff; stroke: #5d9bd5; }
      .boxCore { fill: #ffffff; stroke: #d4a23b; }
      .boxDep { fill: #ffffff; stroke: #9a7bd1; }
      .panelTitle { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .body { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .line { stroke: #344054; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .note { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #667085; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="900" fill="#f6f8fb"/>
  <text x="48" y="54" class="title">xquic_wht 项目架构图</text>
  <text x="48" y="82" class="subtitle">从 GX/mini 应用入口到 XQUIC 公共 API、协议栈实现与外部依赖的调用关系</text>

  <rect x="40" y="120" width="1240" height="155" class="panel appPanel"/>
  <text x="64" y="152" class="panelTitle">应用与测试入口</text>

  <rect x="70" y="178" width="210" height="70" class="box boxApp"/>
  <text x="175" y="204" text-anchor="middle" class="label">GX/stress_gx.py</text>
  <text x="92" y="230" class="body">压测编排: Agg -> 5G2 -> Agg -> 5G1</text>

  <rect x="320" y="178" width="210" height="70" class="box boxApp"/>
  <text x="425" y="204" text-anchor="middle" class="label">GX/serial_at.py</text>
  <text x="342" y="230" class="body">串口 AT 控制 5G 模块上下线</text>

  <rect x="570" y="178" width="210" height="70" class="box boxApp"/>
  <text x="675" y="204" text-anchor="middle" class="label">GX/ssh_gx.py</text>
  <text x="592" y="230" class="body">SSH 设备、切配置、执行 mini_client</text>

  <rect x="820" y="178" width="190" height="70" class="box boxApp"/>
  <text x="915" y="204" text-anchor="middle" class="label">mini_client</text>
  <text x="842" y="230" class="body">HTTP/3 客户端示例/设备侧测试入口</text>

  <rect x="1045" y="178" width="190" height="70" class="box boxApp"/>
  <text x="1140" y="204" text-anchor="middle" class="label">mini_server</text>
  <text x="1067" y="230" class="body">HTTP/3 服务端示例</text>

  <path d="M 280 213 L 320 213" class="thin"/>
  <path d="M 280 225 C 410 280, 520 280, 570 225" class="thin"/>
  <path d="M 780 213 L 820 213" class="line"/>

  <rect x="165" y="325" width="990" height="115" class="panel apiPanel"/>
  <text x="189" y="357" class="panelTitle">公共 API 层: include/xquic</text>

  <rect x="320" y="375" width="250" height="44" class="box boxApi"/>
  <text x="445" y="403" text-anchor="middle" class="label">xquic.h: Engine / Connection / Stream</text>

  <rect x="735" y="375" width="250" height="44" class="box boxApi"/>
  <text x="860" y="403" text-anchor="middle" class="label">xqc_http3.h: H3 Connection / Request</text>

  <path d="M 915 248 L 860 375" class="line"/>
  <path d="M 915 248 L 445 375" class="line"/>
  <path d="M 1140 248 L 860 375" class="line"/>
  <path d="M 1140 248 L 445 375" class="line"/>

  <rect x="40" y="490" width="1240" height="235" class="panel corePanel"/>
  <text x="64" y="522" class="panelTitle">XQUIC 核心库: src</text>

  <rect x="75" y="560" width="210" height="92" class="box boxCore"/>
  <text x="180" y="586" text-anchor="middle" class="label">src/http3</text>
  <text x="96" y="612" class="body">HTTP/3、QPACK、Frame</text>
  <text x="96" y="636" class="body">Request/Stream/Datagram</text>

  <rect x="325" y="560" width="230" height="92" class="box boxCore"/>
  <text x="440" y="586" text-anchor="middle" class="label">src/transport</text>
  <text x="346" y="612" class="body">Engine、Conn、Stream、Packet</text>
  <text x="346" y="636" class="body">Frame、CID、Timer、Multipath</text>

  <rect x="595" y="560" width="210" height="92" class="box boxCore"/>
  <text x="700" y="586" text-anchor="middle" class="label">src/congestion_control</text>
  <text x="616" y="612" class="body">Cubic、BBR</text>
  <text x="616" y="636" class="body">可选 Reno / BBR2 / Copa</text>

  <rect x="845" y="560" width="190" height="92" class="box boxCore"/>
  <text x="940" y="586" text-anchor="middle" class="label">src/tls</text>
  <text x="866" y="612" class="body">TLS ctx、HKDF、crypto</text>
  <text x="866" y="636" class="body">SSL 适配层</text>

  <rect x="1075" y="560" width="165" height="92" class="box boxCore"/>
  <text x="1157" y="586" text-anchor="middle" class="label">src/common</text>
  <text x="1094" y="612" class="body">日志、时间、随机数</text>
  <text x="1094" y="636" class="body">容器、buffer、编码工具</text>

  <path d="M 860 419 L 180 560" class="line"/>
  <path d="M 445 419 L 440 560" class="line"/>
  <path d="M 180 652 L 440 652" class="line"/>
  <path d="M 555 606 L 595 606" class="line"/>
  <path d="M 555 626 L 845 626" class="line"/>
  <path d="M 285 606 C 560 710, 910 710, 1075 626" class="thin"/>

  <rect x="120" y="775" width="1080" height="78" class="panel depPanel"/>
  <text x="144" y="806" class="panelTitle">外部依赖与系统能力</text>

  <rect x="395" y="815" width="210" height="32" class="box boxDep"/>
  <text x="500" y="837" text-anchor="middle" class="label">libevent: 事件循环与 socket 事件</text>

  <rect x="655" y="815" width="210" height="32" class="box boxDep"/>
  <text x="760" y="837" text-anchor="middle" class="label">BabaSSL/Tongsuo 或 BoringSSL</text>

  <rect x="915" y="815" width="210" height="32" class="box boxDep"/>
  <text x="1020" y="837" text-anchor="middle" class="label">Linux UDP / SO_BINDTODEVICE</text>

  <path d="M 915 248 C 760 330, 610 690, 500 815" class="thin"/>
  <path d="M 940 652 L 760 815" class="line"/>
  <path d="M 440 652 C 590 735, 870 735, 1020 815" class="thin"/>

  <text x="48" y="878" class="note">说明: GX 负责设备编排和远端执行；mini 负责演示 API 用法；XQUIC 核心库负责 HTTP/3 与 QUIC 协议栈。</text>
</svg>
